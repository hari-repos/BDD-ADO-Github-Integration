<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDD Canvas for Boards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML = '<div style="background:white; color:red; padding: 20px; z-index:9999; position:absolute; top:0; left:0; width:100%; height:100%;"><h3>Global Error (HTML)</h3><p>' + msg + '</p><pre>' + (error ? error.stack : '') + '</pre></div>';
    };
    window.addEventListener("unhandledrejection", function(event) {
      document.body.innerHTML = '<div style="background:white; color:red; padding: 20px; z-index:9999; position:absolute; top:0; left:0; width:100%; height:100%;"><h3>Unhandled Rejection (HTML)</h3><p>' + event.reason + '</p><pre>' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre></div>';
    });

    // Polyfill localStorage/sessionStorage for sandboxed iframes
    try {
      var _test = window.localStorage;
    } catch(e) {
      Object.defineProperty(window, 'localStorage', { value: { getItem: function(){return null}, setItem: function(){}, removeItem: function(){}, clear: function(){} } });
      Object.defineProperty(window, 'sessionStorage', { value: { getItem: function(){return null}, setItem: function(){}, removeItem: function(){}, clear: function(){} } });
    }
  </script>
  <script type="module" crossorigin src="./assets/index-B_EZAOp1.js"></script>
</head>
<body class="dark-theme">
  <div class="glass-container">
    
    <!-- Top Status Banner -->
    <div id="status-banner" class="banner hidden">
      <span id="banner-message">Status message here</span>
      <button id="banner-close" class="banner-close-btn">&times;</button>
    </div>

    <!-- Main Workspace Split Layout -->
    <div class="workspace-layout">
      
      <!-- Left Config Sidebar -->
      <aside class="sidebar-config glass-card">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="header-icon">
              <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                <path d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.251 2.251 0 1 0 1.5 0V5.372Zm8 5.378a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0V5.372a2.251 2.251 0 1 0-1.5 0v5.256a2.25 2.25 0 1 0 3 0ZM11 5.372a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/>
              </svg>
            </div>
            <h3 style="margin: 0;">Repository Configuration</h3>
          </div>
        </div>

        <div class="form-group">
          <label for="repo-input">Configured Repository</label>
          <input type="text" id="repo-input" placeholder="Loading Project Config..." readonly>
        </div>

        <div class="form-group">
          <label for="base-branch-input">Base Branch</label>
          <input type="text" id="base-branch-input" placeholder="Loading Project Config..." readonly>
        </div>

        <div class="form-group">
          <label for="target-branch-input">Generated Feature Branch</label>
          <input 
            type="text" 
            id="target-branch-input" 
            placeholder="feature/123-title" 
            readonly
          >
        </div>

        <div class="form-group">
          <label for="file-path-input">Feature File Path <span class="required">*</span></label>
          <input 
            type="text" 
            id="file-path-input" 
            placeholder="tests/features/us-102.feature" 
            required 
            disabled
          >
        </div>
      </aside>

      <!-- Right Editor Panel -->
      <section class="editor-section glass-card" style="position: relative;">
        <!-- Missing Config Overlay -->
        <div id="missing-config-overlay" class="hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 20, 20, 0.85); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-radius: 12px; backdrop-filter: blur(5px);">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="#facc15" style="margin-bottom: 16px;">
            <path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v5h-2z"/>
          </svg>
          <h2 style="margin: 0 0 8px 0; color: #fff;">Configuration Missing</h2>
          <p style="color: #9ca3af; max-width: 340px; line-height: 1.5; margin: 0;">This project is not linked to a GitHub repository.<br><br>Please contact your <b>Project Administrator</b> to configure the BDD GitHub Settings under Project Settings.</p>
        </div>
        <div class="card-header editor-header">
          <div class="editor-title-container">
            <div class="header-icon">
              <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                <path d="M4 1.75C4 .784 4.784 0 5.75 0h5.586a1.75 1.75 0 0 1 1.237.513l1.914 1.914c.33.33.513.777.513 1.237v9.586A1.75 1.75 0 0 1 13.25 15h-7.5A1.75 1.75 0 0 1 4 13.25V1.75Zm1.75-.25a.25.25 0 0 0-.25.25v11.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25V4.5h-2a.75.75 0 0 1-.75-.75v-2H5.75Zm4 0v2a.25.25 0 0 0 .25.25h2L10 1.5Z"/>
              </svg>
            </div>
            <h3>BDD Canvas</h3>
            <span id="sync-status-badge" class="badge badge-info">Not Connected</span>
          </div>
          
          <!-- Linter Warning Container -->
          <div id="linter-warning" class="linter-warning-box hidden">
            <span class="warning-icon">⚠️</span>
            <span id="linter-warning-message">Syntax error detected</span>
          </div>
        </div>

        <!-- Monaco Editor Mount Point -->
        <div id="editor-container" class="editor-mount"></div>
      </section>

    </div>

    <!-- Footer Controls -->
    <footer class="workspace-footer">
      <button id="save-button" class="btn btn-primary" disabled>
        <span class="btn-spinner hidden" id="save-spinner"></span>
        <span class="btn-text" id="save-btn-text">Save & Push to GitHub</span>
      </button>
    </footer>

    <!-- Settings Modal Removed (Config is now at the project level) -->

  </div>

  <!-- Monaco Editor configuration scripts -->
</body>
</html>
